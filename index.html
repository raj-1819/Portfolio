<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rajkumar Jangam | Cloud Security Engineer</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>
  <style>
    :root{--bg:#020a0f;--surface:#050f18;--card:#071420;--border:#0a2a3a;--accent:#00e5ff;--accent2:#00ff88;--accent3:#ff3c5a;--text:#c8e6f0;--muted:#4a7a8a;--font-head:'Orbitron',monospace;--font-mono:'Share Tech Mono',monospace;--font-body:'Rajdhani',sans-serif}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,0.015) 2px,rgba(0,229,255,0.015) 4px);pointer-events:none;z-index:9999}
    body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9998;opacity:0.4}
    nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:60px;background:rgba(2,10,15,0.92);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
    .nav-logo{font-family:var(--font-head);font-size:14px;color:var(--accent);letter-spacing:2px}
    .nav-logo span{color:var(--accent2)}
    .nav-links{display:flex;gap:20px;list-style:none;align-items:center}
    .nav-links a{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:1px;transition:color 0.2s}
    .nav-links a:hover{color:var(--accent)}
    .nav-links a::before{content:'./';color:var(--accent2)}
    .visitor-badge{font-family:var(--font-mono);font-size:10px;color:var(--accent2);border:1px solid rgba(0,255,136,0.3);border-radius:20px;padding:3px 10px;background:rgba(0,255,136,0.05)}
    .hero{min-height:100vh;display:flex;align-items:center;padding:80px 60px 60px;position:relative;overflow:hidden}
    .hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.04) 1px,transparent 1px);background-size:50px 50px;animation:gridScroll 20s linear infinite}
    @keyframes gridScroll{from{transform:translateY(0)}to{transform:translateY(50px)}}
    .hero-glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,0.08) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
    .hero-content{position:relative;z-index:2;max-width:750px}
    .hero-tag{font-family:var(--font-mono);font-size:13px;color:var(--accent2);letter-spacing:3px;margin-bottom:16px;opacity:0;animation:fadeUp 0.6s 0.2s forwards}
    .hero-name{font-family:var(--font-head);font-size:clamp(38px,6vw,68px);font-weight:900;color:#fff;line-height:1.05;margin-bottom:10px;opacity:0;animation:fadeUp 0.6s 0.4s forwards}
    .hero-name .accent{color:var(--accent);text-shadow:0 0 30px rgba(0,229,255,0.5)}
    .hero-title{font-family:var(--font-mono);font-size:18px;color:var(--accent);margin-bottom:24px;opacity:0;animation:fadeUp 0.6s 0.6s forwards}
    .cursor{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .hero-desc{font-size:17px;line-height:1.7;color:var(--text);margin-bottom:32px;max-width:600px;opacity:0;animation:fadeUp 0.6s 0.8s forwards}
    .hero-meta{font-family:var(--font-mono);font-size:13px;color:var(--muted);margin-bottom:36px;opacity:0;animation:fadeUp 0.6s 0.9s forwards}
    .hero-meta span{color:var(--accent2);margin-right:8px}
    .hero-btns{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:fadeUp 0.6s 1s forwards}
    .btn{font-family:var(--font-mono);font-size:13px;padding:12px 24px;border-radius:4px;cursor:pointer;text-decoration:none;letter-spacing:1px;transition:all 0.25s;border:1px solid transparent}
    .btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
    .btn-primary:hover{background:transparent;color:var(--accent)}
    .btn-outline{background:transparent;color:var(--accent);border-color:var(--accent)}
    .btn-outline:hover{background:rgba(0,229,255,0.08)}
    .status-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px;opacity:0;animation:fadeUp 0.6s 1.1s forwards}
    .status-badge{font-family:var(--font-mono);font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid;letter-spacing:1px}
    .badge-green{border-color:var(--accent2);color:var(--accent2);background:rgba(0,255,136,0.06)}
    .badge-blue{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,0.06)}
    .badge-red{border-color:var(--accent3);color:var(--accent3);background:rgba(255,60,90,0.06)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .section{max-width:1000px;margin:0 auto 60px;padding:0 30px}
    .section-header{display:flex;align-items:center;gap:16px;margin-bottom:36px}
    .section-num{font-family:var(--font-mono);font-size:12px;color:var(--accent2)}
    .section-title{font-family:var(--font-head);font-size:24px;color:#fff;letter-spacing:2px}
    .section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:28px 32px;position:relative;transition:border-color 0.3s,box-shadow 0.3s}
    .card:hover{border-color:rgba(0,229,255,0.3);box-shadow:0 0 30px rgba(0,229,255,0.06)}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);border-radius:8px 8px 0 0;opacity:0;transition:opacity 0.3s}
    .card:hover::before{opacity:1}
    .edu-card .school{font-family:var(--font-head);font-size:15px;color:var(--accent);margin-bottom:6px}
    .edu-card .degree{font-size:16px;color:#fff;font-weight:600;margin-bottom:4px}
    .edu-card .meta{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
    .edu-card .gpa{display:inline-block;margin-top:8px;font-family:var(--font-mono);font-size:12px;color:var(--accent2);border:1px solid var(--accent2);padding:2px 10px;border-radius:20px}
    .exp-card{margin-bottom:16px}
    .exp-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:6px}
    .exp-role{font-family:var(--font-head);font-size:14px;color:#fff;letter-spacing:1px}
    .exp-company{font-family:var(--font-mono);font-size:12px;color:var(--accent);margin-top:2px}
    .exp-date{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
    .exp-bullets{list-style:none}
    .exp-bullets li{font-size:15px;color:var(--text);padding:3px 0 3px 18px;position:relative;line-height:1.55}
    .exp-bullets li::before{content:'>';position:absolute;left:0;color:var(--accent)}
    .skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
    .skill-category-title{font-family:var(--font-mono);font-size:12px;color:var(--accent2);letter-spacing:2px;margin-bottom:14px}
    .skill-tags{display:flex;flex-wrap:wrap;gap:8px}
    .tag{font-family:var(--font-mono);font-size:12px;padding:5px 12px;border-radius:4px;border:1px solid var(--border);color:var(--text);background:rgba(0,229,255,0.03);transition:all 0.2s}
    .tag:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,0.07)}
    .projects-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .project-card{display:flex;flex-direction:column}
    .project-name{font-family:var(--font-head);font-size:14px;color:#fff;letter-spacing:1px;line-height:1.3}
    .project-badge{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:3px;background:rgba(0,255,136,0.1);border:1px solid var(--accent2);color:var(--accent2);white-space:nowrap}
    .project-badge-new{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:3px;background:rgba(0,229,255,0.1);border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
    .project-desc{font-size:15px;line-height:1.65;color:var(--text);flex:1;margin-bottom:16px}
    .project-bullets{list-style:none;margin-bottom:16px}
    .project-bullets li{font-size:14px;color:var(--text);padding:3px 0 3px 16px;position:relative;line-height:1.55}
    .project-bullets li::before{content:'>';position:absolute;left:0;color:var(--accent)}
    .project-tech{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
    .tech-pill{font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted)}
    .capstone-card{grid-column:1/-1;border-color:rgba(0,229,255,0.25);background:linear-gradient(135deg,#071420,#051018)}
    .capstone-card::before{opacity:1}
    .capstone-inner{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .soc-card{grid-column:1/-1;border-color:rgba(0,255,136,0.3);background:linear-gradient(135deg,#071a10,#051408);position:relative;overflow:hidden}
    .soc-card::before{opacity:1;background:linear-gradient(90deg,var(--accent2),transparent)}
    .soc-card::after{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,136,0.06) 0%,transparent 70%);pointer-events:none}
    .soc-inner{display:grid;grid-template-columns:1fr 1fr;gap:28px}
    .soc-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
    .soc-metric{background:rgba(0,255,136,0.05);border:1px solid rgba(0,255,136,0.15);border-radius:6px;padding:10px 14px}
    .soc-metric-val{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--accent2);line-height:1}
    .soc-metric-label{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:1px}
    .mitre-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
    .mitre-tag{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:3px;border:1px solid rgba(255,60,90,0.4);color:var(--accent3);background:rgba(255,60,90,0.06)}
    .soc-arch{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:6px;padding:14px;line-height:1.9;margin-top:12px}
    .soc-arch .vm-win{color:#4fc3f7}.soc-arch .vm-kali{color:var(--accent3)}.soc-arch .vm-splunk{color:var(--accent2)}.soc-arch .arrow{color:var(--muted)}
    .certs-row{display:flex;gap:12px;flex-wrap:wrap}
    .cert-card{display:flex;align-items:center;gap:14px;padding:16px 20px;flex:1;min-width:160px}
    .cert-icon{font-size:26px}
    .cert-name{font-family:var(--font-head);font-size:11px;color:#fff;letter-spacing:1px;margin-bottom:4px}
    .cert-issuer{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-bottom:3px}
    .cert-status{font-family:var(--font-mono);font-size:10px;color:var(--accent2)}
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .contact-item{display:flex;align-items:center;gap:14px}
    .contact-icon{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent);flex-shrink:0;background:rgba(0,229,255,0.04)}
    .contact-label{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:1px}
    .contact-val{font-size:15px;font-weight:600}
    .contact-val a{color:var(--accent);text-decoration:none}
    .contact-val a:hover{text-decoration:underline}
    footer{text-align:center;padding:40px 20px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:12px;color:var(--muted)}
    footer span{color:var(--accent2)}
    /* METRICS */
    .metrics-dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
    .metric-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px 16px;text-align:center;position:relative;overflow:hidden}
    .metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
    .mc-blue::before{background:var(--accent)}.mc-green::before{background:var(--accent2)}.mc-red::before{background:var(--accent3)}.mc-yellow::before{background:#ffcc00}
    .metric-val{font-family:var(--font-head);font-size:26px;font-weight:900;margin-bottom:4px}
    .mc-blue .metric-val{color:var(--accent)}.mc-green .metric-val{color:var(--accent2)}.mc-red .metric-val{color:var(--accent3)}.mc-yellow .metric-val{color:#ffcc00}
    .metric-label{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:1px}
    .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    .chart-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px}
    .chart-title{font-family:var(--font-mono);font-size:11px;color:var(--accent2);letter-spacing:2px;margin-bottom:14px}
    .chart-wrap{position:relative;height:200px}
    /* THREAT FEED */
    .threat-feed{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px 24px}
    .threat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .threat-status{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--accent2)}
    .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse-anim 2s infinite}
    @keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
    .threat-ticker{height:200px;overflow:hidden;position:relative}
    .threat-ticker::before{content:'';position:absolute;top:0;left:0;right:0;height:30px;background:linear-gradient(to bottom,var(--card),transparent);z-index:2;pointer-events:none}
    .threat-ticker::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(to top,var(--card),transparent);z-index:2;pointer-events:none}
    .threat-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(10,42,58,0.5);font-family:var(--font-mono);font-size:11px}
    .threat-sev{padding:2px 6px;border-radius:3px;font-size:10px;flex-shrink:0}
    .sev-critical{background:rgba(255,60,90,0.15);color:var(--accent3);border:1px solid rgba(255,60,90,0.3)}
    .sev-high{background:rgba(255,150,0,0.12);color:#ff9600;border:1px solid rgba(255,150,0,0.3)}
    .sev-medium{background:rgba(255,204,0,0.1);color:#ffcc00;border:1px solid rgba(255,204,0,0.3)}
    .threat-type{color:var(--accent);flex-shrink:0;min-width:80px}
    .threat-ioc{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .threat-time{color:var(--muted);flex-shrink:0}
    .cve-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .cve-item{background:rgba(255,60,90,0.04);border:1px solid rgba(255,60,90,0.15);border-radius:6px;padding:10px 14px}
    .cve-id{font-family:var(--font-mono);font-size:12px;color:var(--accent3);margin-bottom:4px}
    .cve-score{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
    .cve-desc{font-size:13px;color:var(--text);line-height:1.4;margin-top:4px}
    /* WRITEUPS */
    .writeup-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .writeup-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;display:flex;flex-direction:column;transition:border-color 0.3s,box-shadow 0.3s;position:relative}
    .writeup-card:hover{border-color:rgba(0,229,255,0.3);box-shadow:0 0 20px rgba(0,229,255,0.05)}
    .writeup-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:8px 8px 0 0;opacity:0;transition:opacity 0.3s;background:linear-gradient(90deg,var(--accent),transparent)}
    .writeup-card:hover::before{opacity:1}
    .writeup-tag{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:3px;border:1px solid;display:inline-block;margin-bottom:12px}
    .tag-detection{color:var(--accent2);border-color:rgba(0,255,136,0.3);background:rgba(0,255,136,0.05)}
    .tag-cloud{color:var(--accent);border-color:rgba(0,229,255,0.3);background:rgba(0,229,255,0.05)}
    .tag-threat{color:var(--accent3);border-color:rgba(255,60,90,0.3);background:rgba(255,60,90,0.05)}
    .writeup-title{font-family:var(--font-head);font-size:13px;color:#fff;letter-spacing:1px;margin-bottom:10px;line-height:1.5}
    .writeup-excerpt{font-size:14px;color:var(--muted);line-height:1.6;flex:1;margin-bottom:14px}
    .writeup-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);display:flex;gap:14px}
    .writeup-featured{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.2fr;gap:0;overflow:hidden;padding:0}
    .writeup-featured-left{padding:28px;display:flex;flex-direction:column}
    .writeup-featured-code{background:#010810;padding:28px;font-family:var(--font-mono);font-size:12px;line-height:1.8;color:var(--muted);overflow:auto;border-left:1px solid var(--border)}
    .code-comment{color:#2a5a3a}.code-keyword{color:var(--accent)}.code-string{color:var(--accent2)}.code-var{color:#ff9600}
    /* ANALYTICS */
    .analytics-bar{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px 24px;margin-bottom:20px}
    .analytics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .analytics-stat{text-align:center}
    .analytics-val{font-family:var(--font-head);font-size:22px;color:var(--accent);margin-bottom:2px}
    .analytics-label{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:1px}
    .referrer-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
    .ref-badge{font-family:var(--font-mono);font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
    .ref-badge.active{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,0.05)}
    /* AI BOT */
    #ai-btn{position:fixed;bottom:30px;right:30px;z-index:2000;background:var(--accent);color:var(--bg);font-family:var(--font-mono);font-size:12px;padding:12px 20px;border-radius:4px;cursor:pointer;border:none;letter-spacing:1px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 0 20px rgba(0,229,255,0.3);transition:all 0.2s}
    #ai-btn:hover{box-shadow:0 0 30px rgba(0,229,255,0.5)}
    .btn-dot{width:8px;height:8px;border-radius:50%;background:var(--bg);animation:pulse-anim 2s infinite}
    #ai-panel{position:fixed;bottom:90px;right:30px;z-index:2000;width:380px;height:520px;background:#030e18;border:1px solid var(--accent);border-radius:8px;display:none;flex-direction:column;box-shadow:0 0 40px rgba(0,229,255,0.15)}
    #ai-panel.open{display:flex}
    .ai-header{background:rgba(0,229,255,0.07);padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .ai-header-left{display:flex;align-items:center;gap:10px}
    .ai-avatar{width:32px;height:32px;border-radius:4px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:11px;color:var(--bg);font-weight:700}
    .ai-title{font-family:var(--font-head);font-size:12px;color:var(--accent)}
    .ai-sub{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
    .ai-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0;line-height:1}

let aiOpen=false,chatHistory=[];

function askChip(btn){document.getElementById('ai-input').value=btn.textContent;sendAI();}
async function sendAI(){
  const inp=document.getElementById('ai-input');
  const q=inp.value.trim();if(!q)return;inp.value='';
  const msgs=document.getElementById('ai-messages');
  const sendBtn=document.getElementById('ai-send');
  const uDiv=document.createElement('div');uDiv.className='msg msg-user';uDiv.textContent=q;msgs.appendChild(uDiv);
  const tDiv=document.createElement('div');tDiv.className='msg msg-typing';tDiv.textContent='processing query...';msgs.appendChild(tDiv);
  msgs.scrollTop=msgs.scrollHeight;sendBtn.disabled=true;
  chatHistory.push({role:'user',content:q});
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:400,system:SYS,messages:chatHistory})});
    const data=await r.json();
    const ans=data.content?.[0]?.text||'Connection error. Please try again.';
    chatHistory.push({role:'assistant',content:ans});
    tDiv.remove();
    const bDiv=document.createElement('div');bDiv.className='msg msg-bot';bDiv.textContent=ans;msgs.appendChild(bDiv);
  }catch(e){tDiv.remove();const eDiv=document.createElement('div');eDiv.className='msg msg-bot';eDiv.textContent='// Error -- please try again.';msgs.appendChild(eDiv);}
  sendBtn.disabled=false;msgs.scrollTop=msgs.scrollHeight;
}
